<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DJ Fishing · DJ FIVEM SCRIPTS</title>
  <style>html,body{background:transparent!important;background-color:transparent!important;}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden" aria-hidden="true">
    <div class="shell">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>

      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="brand/logo.png" alt="DJ FIVEM SCRIPTS" />
          <div>
            <strong>DJ Fishing</strong>
            <small id="shop-subtitle">Tackle &amp; market</small>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button type="button" class="nav-btn active" data-view="shop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16l-1.2 12.4A2 2 0 0 1 16.81 21H7.19a2 2 0 0 1-1.99-1.6L4 7z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
            Store
          </button>
          <button type="button" class="nav-btn" data-view="sell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12c4-6 12-6 16 0-4 6-12 6-16 0z"/><circle cx="12" cy="12" r="2.2"/></svg>
            Sell
          </button>
          <button type="button" class="nav-btn" data-view="tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Tasks
          </button>
          <button type="button" class="nav-btn" data-view="board">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15v4M12 11v8M16 8v11"/></svg>
            Board
          </button>
        </nav>

        <div class="profile">
          <div class="profile-copy">
            <strong id="player-name">Angler</strong>
            <span>Licensed angler</span>
          </div>
          <div class="avatar" id="player-avatar">DJ</div>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></svg>
          <input id="search" type="text" placeholder="Search gear or catch..." autocomplete="off" />
        </label>
      </div>

      <main class="content" id="content"></main>

      <footer class="footer">
        <span class="footer-brand">
          <img src="brand/logo.png" alt="" />
          DJ FIVEM SCRIPTS
        </span>
        <span class="keychip">ESC Close</span>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
