<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>305 Fishing</title>
  <style>html,body{background:transparent!important;background-color:transparent!important;}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden" aria-hidden="true">
    <div class="shell">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>

      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="brand/the305.png" alt="The 305" />
          <div>
            <strong id="shop-title">305 Fishing</strong>
            <small id="shop-subtitle">Vice City tackle</small>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="profile">
          <div class="profile-copy">
            <strong id="player-name">Angler</strong>
            <span id="player-role">Licensed 305 angler</span>
          </div>
          <div class="avatar" id="player-avatar">305</div>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <label class="search" id="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></svg>
          <input id="search" type="text" placeholder="Search the marina..." autocomplete="off" />
        </label>
      </div>

      <main class="content" id="content"></main>

      <footer class="footer">
        <span class="footer-brand">
          <img src="brand/the305.png" alt="" />
          THE 305
        </span>
        <span class="keychip">ESC Close</span>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
